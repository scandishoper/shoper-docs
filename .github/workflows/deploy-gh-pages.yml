name: deploy-gh-pages
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # 与现有 CNAME 一致，保证 canonical 和 RSS 使用实际博客网址。
      SITE_URL: "https://docs.scandidreams.top/"

      # ✅ 默认不启用私密加密（需要时改 true，或在 Actions env/secret 控制）
      ENABLE_PRIVATE: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 给 git 日期/作者插件用（如果你启用了这些插件）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test automatic article discovery
        run: python -m unittest discover -s tests

      - name: Build
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
