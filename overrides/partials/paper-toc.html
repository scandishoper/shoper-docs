{% macro contents(items, nested=false) %}
<ul class="{% if nested %}paper-toc-sub{% else %}paper-toc-list{% endif %}">
{% for item in items %}
  <li><a href="{{ item.url | e }}">{{ item.title | striptags | e }}</a>
    {% if item.children %}{{ contents(item.children, nested=true) }}{% endif %}
  </li>
{% endfor %}
</ul>
{% endmacro %}
