site_name: shoper
site_description: 记录计算机学习，也记录生活中的想法。
site_author: shoper
site_url: !ENV [SITE_URL, "https://docs.scandidreams.top/"]
repo_url: https://github.com/scandishoper/shoper-docs

theme:
  name: material
  custom_dir: overrides
  favicon: assets/2026-3-20-1.jpg
  language: zh
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换深色阅读
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换浅色阅读
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.top

# 自动发现文章，生成专题与归档，无需维护文章目录。
hooks:
  - hooks/blog.py
  - hooks/comments.py

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      enable_creation_date: true
      fallback_to_build_date: false
  - encryptcontent:
      enabled: !ENV [ENABLE_PRIVATE, false]
      title_prefix: "[受保护] "
      global_password: ""
      remember_password: true
  - rss:
      enabled: !ENV [CI, false]
      match_path: '^(algo|solutions|csdiy|technology|views|blog)/(?!index\.md$)(?!.*/index\.md$).+\.md$'
      date_from_meta:
        as_creation: date
        as_update: date
        datetime_format: '%Y-%m-%d'
        default_timezone: Asia/Shanghai
  - redirects:
      enabled: !ENV [CI, false]
  - minify:
      enabled: !ENV [CI, false]

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      permalink_title: 此章节的链接
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/paper.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/paper.js

extra:
  generator: false
  consent:
    title: 关于访问统计
    description: 可选择允许匿名访问统计，帮助我了解哪些文章更有用。拒绝不会影响阅读。
    actions:
      - accept
      - reject
      - manage
  analytics:
    provider: google
    property: G-8JQ8PJF435

# 仅声明主要页面；栏目和文章会在构建时自动补齐。
nav:
  - 文章: index.md
  - 专题: topics.md
  - 归档: archive.md
  - 关于: about.md
